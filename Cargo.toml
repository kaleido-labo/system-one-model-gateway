[package]
name = "systemone-gateway"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "One gateway in front of TypeSafe's System One API: absorbs calls from many services, merges the ones that share a state, and hands each caller back its own answers"
readme = "README.md"
repository = "https://github.com/kaleido-labo/system-one-model-gateway"
homepage = "https://github.com/kaleido-labo/system-one-model-gateway"
keywords = ["gateway", "llm", "proxy", "rate-limiting", "typesafe"]
categories = ["web-programming::http-server", "network-programming"]
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8.9"
bytes = "1.12"
clap = { version = "4.6", features = ["derive", "env"] }
fastrand = "2.5"
getrandom = "0.4"
hex = "0.4"
httpdate = "1"
indexmap = { version = "2.14", features = ["serde"] }
prometheus-client = "0.25"
reqwest = "0.13.5"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
toml = "1.1"
tower-http = { version = "0.7.1", features = ["trace", "request-id", "catch-panic"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }

[dev-dependencies]
tokio = { version = "1.53", features = ["test-util"] }
