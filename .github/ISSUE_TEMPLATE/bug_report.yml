name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. For a security problem, do not open an issue: see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest configuration and request that shows the problem. A run against the mock upstream (`cargo run --example mock_upstream`) is ideal. Remove API keys and key hashes you care about.
      render: shell
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Batching
        - Routing
        - Chat backend
        - Rate limiting
        - Configuration
        - Observability
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `systemone-gateway --version`, or the commit you built.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How you run it
      options:
        - Docker image built from the Dockerfile
        - cargo run / cargo build
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and metrics
      description: Relevant log lines, or `/metrics` values such as `upstream_calls_total`. Set `log_format = "json"` if you can.
      render: shell
